<style>
:root{--bg:#faf6f0;--card:#fff;--tx:#2a2118;--mut:#7a6a58;--ac:#c0392b;--bd:#eadfce}
@media (prefers-color-scheme:dark){:root{--bg:#1d1814;--card:#2a231d;--tx:#f5ece0;--mut:#b8a794;--ac:#e8695a;--bd:#3d342b}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;line-height:1.6}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{text-align:center;color:var(--ac);font-size:26px;margin:8px 0 16px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.item img,.ph{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:var(--bd)}
.info{flex:1;min-width:0}.info b{font-size:16px}.price{color:var(--ac);font-weight:bold}
.pay{background:var(--card);border:2px dashed var(--ac);border-radius:14px;padding:14px;margin-top:20px;text-align:center}
.pay div{margin:8px 0}.num{font-size:22px;font-weight:bold;direction:ltr;display:inline-block;margin:0 8px}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 16px;font-size:14px;font-family:inherit}
button.g{background:var(--mut)}
input{width:100%;box-sizing:border-box;padding:8px;margin:3px 0;border:1px solid var(--bd);border-radius:8px;font-size:15px;font-family:inherit;background:var(--bg);color:var(--tx)}
.bar{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.adm{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0}
footer{text-align:center;margin:24px 0}
</style>
